; --- Arduino Uno R4 WiFi (Renesas RA4M1) ---
[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = 
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0
    blynkkk/Blynk@^1.3.2

